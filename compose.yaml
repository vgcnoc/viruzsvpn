name: vpnops

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vpnops}
      MYSQL_USER: ${DB_USERNAME:-vpnops}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    environment: &api-environment
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.docker}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-vpnops}
      DB_USERNAME: ${DB_USERNAME:-vpnops}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: ./backend
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["php", "artisan", "queue:work", "--tries=2", "--timeout=45", "--sleep=2"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build: ./backend
    command: ["php", "artisan", "schedule:work"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
