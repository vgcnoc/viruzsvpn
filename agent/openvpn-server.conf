port 1196
proto tcp-server
dev tun-virvpn
topology subnet
server 10.77.0.0 255.255.255.0 nopool
ca /etc/virvpn-openvpn/ca.crt
cert /etc/virvpn-openvpn/server.crt
key /etc/virvpn-openvpn/server.key
dh none
tls-version-min 1.2
verify-client-cert none
username-as-common-name
auth-user-pass-verify "/usr/bin/python3 /opt/virvpn-openvpn/openvpn_agent.py auth" via-file
script-security 2
client-config-dir /etc/virvpn-openvpn/ccd
ccd-exclusive
cipher AES-256-CBC
data-ciphers AES-256-GCM:AES-256-CBC
data-ciphers-fallback AES-256-CBC
auth SHA1
keepalive 10 60
persist-key
persist-tun
max-clients 200
management /run/virvpn-openvpn/management.sock unix
management-client-user root
management-client-group root
status /run/virvpn-openvpn/status.log 10
status-version 3
verb 3
